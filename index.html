      <div class="blush left"></div><div class="blush right"></div>
      <div class="mouth"><svg width="30" height="14" viewBox="0 0 30 14"><path d="M3,3 Q8,12 15,5 Q22,12 27,3" fill="none" stroke="#e8a0a8" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div class="sad-mouth"><svg width="28" height="12" viewBox="0 0 28 12"><path d="M4,10 Q14,1 24,10" fill="none" stroke="#9e9e9e" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div class="mage-mouth"><svg width="46" height="28" viewBox="0 0 46 28"><path d="M4,4 Q23,32 42,4" fill="#e8a0a8" stroke="#d4808a" stroke-width="2" stroke-linecap="round"/><path d="M13,7 Q23,2 33,7" fill="white" opacity="0.85"/></svg></div>
      <div class="tail"></div>
    </div>
    <div class="arm left"></div><div class="arm right"></div>
    <div class="foot left"></div><div class="foot right"></div>
  </div>
  <div class="ground-shadow"></div>
  <p class="label" id="label">hewwo ♡</p>
</div>

<div class="hunger-bar"><div class="hunger-icon" id="hIcon">🧁</div><div class="hunger-track"><div class="hunger-fill" id="hFill" style="height:50%"></div></div></div>
<div class="cupcake-count" id="cCount"></div>
<button class="cupcake-btn" id="cBtn" title="Feed cupcake!">🧁</button>
<div class="feed-label">feed me!</div>

<script>
const C = document.getElementById('char'), P = document.getElementById('particles'), L = document.getElementById('label');
const hFill = document.getElementById('hFill'), hIcon = document.getElementById('hIcon');
const cBtn = document.getElementById('cBtn'), cCount = document.getElementById('cCount');
const flash = document.getElementById('flash'), ring = document.getElementById('ring');

const hcol = ['#ffb3ba','#ffdfba','#ffffba','#baffc9','#bae1ff','#e8b3ff','#ffb3de'];
const scol = ['#ffd700','#ff69b4','#87ceeb','#dda0dd','#ffa07a','#98fb98'];
const hrt = ['♥','♡','❤','💕','💖','💗','✿','🌸'];
const mhrt = ['⭐','✨','💫','🌟','💖','💜','🔮','🌙','🪄'];
const mstars = ['✦','✧','⟡','✶','❋','✺','★'];
let pc = 0; const MX = 60;

let hunger = 50, cupcakes = 0, state = 'normal', mageInt = null;

// Bokeh
(function(){const c=['#ffcdd2','#f8bbd0','#e1bee7','#c5cae9','#b3e5fc','#c8e6c9','#fff9c4','#ffe0b2'];for(let i=0;i<15;i++){const b=document.createElement('div');b.className='bokeh';const s=10+Math.random()*40;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}vw;background:${c[~~(Math.random()*c.length)]};animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(b)}})();

function spawn(cls, x, y, txt, sz, col, dur) {
  if (pc >= MX) return;
  const el = document.createElement('div'); el.className = 'particle ' + cls;
  if (txt) el.textContent = txt;
  el.style.left = (x + (Math.random()-.5)*80) + 'px';
  el.style.top = (y + (Math.random()-.5)*40) + 'px';
  if (sz) el.style.fontSize = sz + 'px';
  if (col) el.style.color = col;
  if (cls === 'sparkle') { const s = 6+Math.random()*8; el.style.width=s+'px'; el.style.height=s+'px'; }
  el.style.animationDuration = (dur||2) + 's';
  P.appendChild(el); pc++;
  el.addEventListener('animationend', () => { el.remove(); pc--; });
}
function sH(x,y) { const pool = state==='mage'?mhrt:hrt; spawn('heart',x,y,pool[~~(Math.random()*pool.length)],14+Math.random()*(state==='mage'?28:18),hcol[~~(Math.random()*hcol.length)],1.8+Math.random()*1.5); }
function sS(x,y) { spawn('sparkle',x,y,null,null,scol[~~(Math.random()*scol.length)],0.8+Math.random()*0.8); }
function sStar() { const el=document.createElement('div');el.className='mage-star';el.textContent=mstars[~~(Math.random()*mstars.length)];el.style.left=Math.random()*innerWidth+'px';el.style.top=Math.random()*innerHeight+'px';el.style.fontSize=(22+Math.random()*28)+'px';el.style.color=['#ff80ab','#ea80fc','#8c9eff','#80d8ff','#ffd54f'][~~(Math.random()*5)];document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove()); }
function blastRing() { ring.classList.remove('blast');void ring.offsetWidth;ring.classList.add('blast');setTimeout(()=>ring.classList.remove('blast'),1000); }

setInterval(() => { if (state==='sad') return; const r=C.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; sH(cx,cy-30); if(Math.random()>.4)sS(cx,cy); }, 1200);

let hb=false;
C.addEventListener('mouseenter', () => { if(hb||state==='sad')return; hb=true; const r=C.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; for(let i=0;i<8;i++)setTimeout(()=>{sH(cx,cy-20);sS(cx,cy)},i*60); });
C.addEventListener('mouseleave', () => { hb=false; });
C.addEventListener('click', () => {
  C.classList.remove('squish');void C.offsetWidth;C.classList.add('squish');setTimeout(()=>C.classList.remove('squish'),500);
  const r=C.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<(state==='mage'?22:15);i++)setTimeout(()=>{sH(cx,cy-30);sS(cx,cy-10)},i*35);
  if(state==='mage') blastRing();
});
document.addEventListener('mousemove', e => {
  const r=C.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.35;
  const dx=Math.max(-3.5,Math.min(3.5,(e.clientX-cx)/innerWidth*5));
  const dy=Math.max(-2.5,Math.min(2.5,(e.clientY-cy)/innerHeight*4));
  document.querySelectorAll('.eye-highlight-main,.eye-highlight-small').forEach(h=>{h.style.transform=`translate(${dx}px,${dy}px)`});
});
C.addEventListener('touchstart', e => { e.preventDefault(); C.click(); }, { passive: false });

// Feed
cBtn.addEventListener('click', () => {
  const br=cBtn.getBoundingClientRect(); const el=document.createElement('div');el.className='flying-cupcake';el.textContent='🧁';el.style.left=br.left+'px';el.style.top=br.top+'px';
  const cr=C.getBoundingClientRect();const tx=cr.left+cr.width/2-17,ty=cr.top+cr.height/2-17;
  el.style.transition='left .45s ease-in,top .45s ease-in,transform .45s,opacity .45s';
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.left=tx+'px';el.style.top=ty+'px';el.style.transform='scale(.2) rotate(360deg)';el.style.opacity='0'});
  setTimeout(()=>el.remove(),500);
  hunger=Math.min(100,hunger+15); cupcakes++;
  upd();
});

setInterval(() => { hunger=Math.max(0,hunger-2); upd(); }, 2500);

const sadL=['...hungry :(','need cupcake...','*sniff*','pwease feed me','so empty...'];
const hapL=['hewwo ♡','hehe~','*happy noises*','nyaa~ ♡','ily fren ♡'];
const magL=['✨ LOVE BEAM ✨','💖 MAGE MODE 💖','🌟 FULL POWER 🌟','⭐ CUPCAKE POWER ⭐','🔮 MAGICAL FREN 🔮'];

function upd() {
  const prev = state;
  state = hunger >= 85 ? 'mage' : hunger <= 20 ? 'sad' : 'normal';
  hFill.style.height = hunger+'%';
  hFill.className = 'hunger-fill' + (state==='sad'?' low':'') + (state==='mage'?' mage':'');
  hIcon.textContent = state==='sad'?'😿':state==='mage'?'🔮':'🧁';
  cCount.textContent = cupcakes>0 ? '×'+cupcakes : '';
  C.classList.toggle('sad-mode', state==='sad');
  C.classList.toggle('mage-mode', state==='mage');
  document.body.classList.toggle('sad-bg', state==='sad');
  document.body.classList.toggle('mage-bg', state==='mage');

  if (state==='sad') { L.className='label sad'; L.textContent=sadL[~~(Math.random()*sadL.length)]; }
  else if (state==='mage') { L.className='label mage'; L.textContent=magL[~~(Math.random()*magL.length)]; }
  else { L.className='label'; L.textContent=hapL[~~(Math.random()*hapL.length)]; }

  if (state==='mage' && prev!=='mage') {
    flash.classList.remove('active');void flash.offsetWidth;flash.classList.add('active');
    blastRing();
    const r=C.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(let i=0;i<28;i++)setTimeout(()=>{sH(cx,cy-40);sS(cx,cy);sStar()},i*45);
    if(!mageInt) mageInt=setInterval(()=>{if(state!=='mage'){clearInterval(mageInt);mageInt=null;return}sStar();const r2=C.getBoundingClientRect();sH(r2.left+r2.width/2,r2.top);sS(r2.left+r2.width/2,r2.top+r2.height/2);if(Math.random()>.7)blastRing()},350);
  }
  if(state!=='mage'&&mageInt){clearInterval(mageInt);mageInt=null}
}
upd();
</script>
</body>
</html>
